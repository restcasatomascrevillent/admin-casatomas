# Comprobaciones automáticas del panel (propuesta de la auditoría de regresión
# del 18/10/2026). Ningún paso necesita secretos ni habla con Supabase: los
# tests usan un host local inalcanzable (vitest.config.ts) y las pruebas SQL
# corren en Postgres en memoria (PGlite).
#
# BLOQUEAN: instalación reproducible, tests unitarios, pruebas SQL y build.
# NO BLOQUEAN todavía (deuda previa, cifras de la auditoría): typecheck con 20
# errores y ESLint con 480. Quitar `continue-on-error` cuando lleguen a cero.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-y-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios y de componentes
        run: npm test
      - name: Ciclo de vida de cheques regalo (PGlite)
        run: npm run test:cheques:db
      - name: Auditoría (PGlite)
        run: npm run test:auditoria:db
      - name: Reversión de auditoría, bloqueo de usuarios y superadmin (PGlite)
        run: |
          node scripts/verificar-auditoria.mjs
          node scripts/verificar-bloqueo-usuarios.mjs
          node scripts/verificar-gestion-superadmin.mjs
      - name: Build de producción
        run: npm run build

  calidad-no-bloqueante:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # continue-on-error en cada paso y no en el job: la deuda previa no bloquea y
      # el check sale en verde, con los errores en las anotaciones y en el resumen.
      # Con continue-on-error en el job, GitHub lo pintaba en rojo en cada PR.
      - name: Typecheck (20 errores previos)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint (480 errores previos)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Resumen
        if: always()
        run: |
          {
            echo "### Calidad (informativa, no bloquea)"
            echo "- Typecheck: ${{ steps.typecheck.outcome == 'success' && 'sin errores' || 'con errores previos, ver anotaciones' }}"
            echo "- ESLint: ${{ steps.lint.outcome == 'success' && 'sin errores' || 'con errores previos, ver anotaciones' }}"
          } >> "$GITHUB_STEP_SUMMARY"


  control-promocion:
    name: Validar promoción a producción
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Solo staging puede promocionarse a main
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "staging" ]; then
            echo "::error::Producción solo admite PR desde staging (rama recibida: $SOURCE_BRANCH)"
            exit 1
          fi
