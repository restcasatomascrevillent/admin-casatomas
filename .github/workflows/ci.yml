# Comprobaciones automáticas del panel (propuesta de la auditoría de regresión
# del 18/10/2026). Ningún paso necesita secretos ni habla con Supabase: los
# tests usan un host local inalcanzable (vitest.config.ts) y las pruebas SQL
# corren en Postgres en memoria (PGlite).
#
# BLOQUEAN: instalación reproducible, tests unitarios, pruebas SQL, build y el
# TOPE DE DEUDA de calidad: typecheck con 20 errores y ESLint con 479 errores
# (cifras del 30/10/2026, CT-REM-OPS-09). Es un "trinquete": el job falla si el
# recuento SUBE; si baja, hay que bajar también el tope en este fichero (los dos
# valores TOPE_* de abajo). Cuando lleguen a cero, sustituir por el check normal.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]
  # Lo lanza «Release · preparar» sobre la rama release/X.Y.Z: los PR que abre Actions con su
  # token no disparan otros workflows (docs/PROCESO-DE-CAMBIOS.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-y-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios y de componentes
        run: npm test
      - name: Ciclo de vida de cheques regalo (PGlite)
        run: npm run test:cheques:db
      - name: Auditoría (PGlite)
        run: npm run test:auditoria:db
      - name: Botones y menú de las novedades (PGlite)
        run: npm run test:novedades:db
      - name: Mínimo privilegio y RLS de tablas núcleo (PGlite)
        run: npm run test:minimo-privilegio:db
      - name: Limitadores de abuso, superadmin mínimo y secreto de fotos (PGlite)
        run: npm run test:abuso:db
      - name: RLS de espacios_reserva por sección (PGlite)
        run: npm run test:espacios:db
      - name: Trabajos de vídeo para dispositivo potente (PGlite)
        run: npm run test:trabajos-video:db
      - name: Trabajos de recorte de fotos en un ordenador (PGlite)
        run: npm run test:trabajos-recorte:db
      - name: Límites de los cubos de fotos (PGlite)
        run: npm run test:cubos-fotos:db
      - name: Restricciones de Platos y Vinos (PGlite)
        run: npm run test:restricciones-carta:db
      - name: Restricciones de novedades y espacios_reserva (PGlite)
        run: npm run test:restricciones:db
      - name: Restricciones de Bebidas y Cocteles (PGlite)
        run: npm run test:restricciones-bebidas:db
      - name: Platos.updated_at cambia al editar (PGlite)
        run: npm run test:platos-updated-at:db
      - name: Alertas de un documento al añadir o borrar líneas (PGlite)
        run: npm run test:alertas-lineas:db
      - name: Indicaciones para la IA por proveedor (PGlite)
        run: npm run test:proveedores-notas-ia:db
      - name: Servicios contratados y su consumo, solo super admin (PGlite)
        run: npm run test:servicios:db
      - name: Cambio de la propia contraseña, límite de intentos (PGlite)
        run: npm run test:cambio-contrasena:db
      - name: Tienda de vinos, escaparate (PGlite)
        run: npm run test:tienda:db
      - name: Recorte en el servidor, constancia y topes de gasto (PGlite)
        run: npm run test:recorte-servidor:db
      - name: Vinos, un interruptor por carta y sin publicar sin origen (PGlite)
        run: npm run test:vinos-publicacion:db
      - name: Permiso propio de Reservas › Configuración (PGlite)
        run: npm run test:reservas-configuracion:db
      - name: Solo «Ver» canjea cheques; migración y rollback (PGlite)
        run: npm run test:permisos-solo-ver:db
      - name: Logs web, incidencias y estadísticas de comportamiento (PGlite)
        run: npm run test:logs-web:db
      - name: Facturas, «Ver» solo consulta y permiso «Facturas · Subida» (PGlite)
        run: npm run test:permisos-facturas-subida:db
      - name: Vino por copas, Parker, votación del vino favorito, horario de menú y tapas y platos vegetarianos (PGlite)
        run: npm run test:vinos-copeo-encuesta:db
      - name: Instagram, bucket y piezas por la sección marketing (PGlite)
        run: npm run test:instagram:db
      - name: Originales de las fotos de la carta en Drive (PGlite)
        run: npm run test:carta-originales:db
      - name: Instagram, publicaciones programadas, RPC y cron del programador (PGlite)
        run: npm run test:instagram-programar:db
      - name: Métricas de Instagram, tablas, RLS y cron (PGlite)
        run: npm run test:instagram-metricas:db
      - name: Instagram, estado de publicación solo por el servidor, cerrojo, texto alternativo y limpieza del bucket (PGlite)
        run: npm run test:instagram-servidor:db
      - name: IA de textos de Instagram, guías de marca y sugerencias (PGlite)
        run: npm run test:instagram-ia:db
      - name: Fechas y campañas de Instagram, borradores con fecha prevista (PGlite)
        run: npm run test:instagram-campanas:db
      - name: Reels en MP4, cola de render, cubo de vídeo y reels «procesando» (PGlite)
        run: npm run test:instagram-video:db
      - name: Métricas para aprender de Instagram, «Qué funciona» (PGlite)
        run: npm run test:instagram-aprender:db
      - name: Encargos de Instagram, estados por RPC, agencia, rondas y pieza al aprobar (PGlite)
        run: npm run test:instagram-encargos:db
      - name: Seguridad de Instagram, «Editar» para escribir, agencia y trabajador de render limitados, limpieza de vídeo y cupo de IA (PGlite)
        run: npm run test:instagram-seguridad:db
      - name: Carruseles de Instagram, diapositivas, programar con el texto y limpieza de todas las imágenes (PGlite)
        run: npm run test:instagram-carrusel:db
      - name: RRSS, editor IA, generación única por trabajo, topes diarios, cubo privado y rollback (PGlite)
        run: npm run test:rrss:db
      - name: «Editar» para escribir en la carta y en el newsletter; con solo «Ver», consulta (PGlite)
        run: npm run test:permisos-carta-newsletter:db
      - name: Mesa fijada de una reserva, migración y rollback (PGlite)
        run: npm run test:mesa-fijada:db
      - name: Versiones de migración sin repetir (salvo las históricas)
        run: npm run test:migraciones
      - name: Recorte en el servidor, inferencia real con onnxruntime-node (Linux)
        run: npx vitest run api/
        env:
          RECORTE_INFERENCIA: "1"
      - name: Reversión de auditoría, bloqueo de usuarios y superadmin (PGlite)
        run: |
          node scripts/verificar-auditoria.mjs
          node scripts/verificar-bloqueo-usuarios.mjs
          node scripts/verificar-gestion-superadmin.mjs
      - name: Build de producción
        run: npm run build

  calidad-tope-deuda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPE_TSC: "20"
      TOPE_ESLINT: "479"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (no puede superar el tope)
        run: |
          npx tsc --noEmit -p tsconfig.app.json > tsc.log || true
          n=$(grep -c "error TS" tsc.log || true)
          echo "Errores de tipos: $n (tope $TOPE_TSC)"
          if [ "$n" -gt "$TOPE_TSC" ]; then
            grep "error TS" tsc.log | head -50
            echo "::error::Typecheck: $n errores, el tope es $TOPE_TSC. No se puede aumentar la deuda."
            exit 1
          fi
          if [ "$n" -lt "$TOPE_TSC" ]; then
            echo "::warning::Bajaste a $n errores de tipos: baja TOPE_TSC a $n en .github/workflows/ci.yml."
          fi
      - name: ESLint (no puede superar el tope)
        run: |
          npx eslint . -f json -o eslint.json || true
          n=$(node -e "const r=require('./eslint.json');console.log(r.reduce((a,f)=>a+f.errorCount,0))")
          echo "Errores de ESLint: $n (tope $TOPE_ESLINT)"
          if [ "$n" -gt "$TOPE_ESLINT" ]; then
            echo "::error::ESLint: $n errores, el tope es $TOPE_ESLINT. No se puede aumentar la deuda."
            exit 1
          fi
          if [ "$n" -lt "$TOPE_ESLINT" ]; then
            echo "::warning::Bajaste a $n errores de ESLint: baja TOPE_ESLINT a $n en .github/workflows/ci.yml."
          fi

  control-release:
    name: Validar release a producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Producción solo acepta PR desde release/X.Y.Z (scripts/release.mjs comprobar): nada de
    # staging entero, versión y CHANGELOG coherentes y basada en el último main.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/'))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rama, versión, CHANGELOG y base de la release
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: node scripts/release.mjs comprobar --base origin/main --head HEAD --rama "$RAMA"
