project_id = "sfonaclosuafvlhutkon"

# ============================================================================
# verify_jwt — criterio de este proyecto
# ----------------------------------------------------------------------------
# LEER ANTES DE TOCAR NADA: `verify_jwt = true` NO ES AUTENTICACIÓN.
# La anon/publishable key es un JWT válido y viaja en el bundle público de las
# webs y del panel, así que cualquiera puede copiarla y pasar el filtro. Lo
# único que hace `true` es descartar en la pasarela las peticiones que no traen
# NINGUNA cabecera (bots, curl a pelo, escáneres). Es un filtro barato, no una
# barrera. La autorización de verdad la tiene que hacer cada función.
#
# Regla aplicada aquí:
#   · false  SOLO si la función necesita ser alcanzable SIN cabeceras
#            (enlaces GET dentro de un correo, webhooks de terceros) Y lleva su
#            propia autenticación real (HMAC, firma svix).  -> 3 funciones.
#   · true   en todo lo demás. Todos sus llamadores usan
#            `supabase.functions.invoke()` con sesión iniciada, o `fetch` con
#            `apikey` + `Authorization`, así que el filtro no les afecta.
#
# TODA función desplegable tiene entrada explícita abajo. Si falta una, la CLI
# asume `verify_jwt = true` al desplegarla y puede romperla en silencio.
# ============================================================================


# ----------------------------------------------------------------------------
# verify_jwt = false — las funciones que TIENEN que responder sin cabeceras
# ----------------------------------------------------------------------------

# Rutas GET dentro de un correo electrónico: el cliente pulsa "Confirmar" o
# "Cancelar" desde Gmail y el navegador NO manda `Authorization` ni `apikey`.
# Con verify_jwt = true la pasarela devuelve 401 antes de ejecutar la función y
# el flujo de confirmación de reservas queda muerto.
# La autenticación real es un token HMAC-SHA256 de un solo uso por reserva
# (RESERVAS_WEB_TOKEN_SECRET, firma sobre id+acción+huella de la fila; el
# primer uso mueve `updated_at` e invalida el token). Ver index.ts:275-345.
# Las 2 rutas POST (/disponibilidad, /crear) sí reciben
# `apikey` + `Authorization` desde casa-tomas-story, así que no pierden nada.
[functions.reservas-web]
verify_jwt = false

# Pública sin JWT: la visitan destinatarios anónimos del newsletter (enlace de
# baja en el email / cabecera List-Unsubscribe). Se autoriza con un HMAC propio
# en vez de con Supabase Auth (ver supabase/functions/newsletter-baja/index.ts).
[functions.newsletter-baja]
verify_jwt = false

# La llama Resend, no el panel: nunca va a traer un JWT de Supabase. Verifica
# la firma svix de la petición, que es su autenticación de verdad.
[functions.resend-webhook]
verify_jwt = false

# Rutas GET dentro de un correo electrónico: el cliente pulsa "Sí, confirmo
# mi asistencia" o "No puedo, cancelar reserva" desde Gmail y el navegador
# NO manda `Authorization` ni `apikey`. Mismo motivo exacto que
# reservas-web arriba. La autenticación real es un token HMAC-SHA256 de un
# solo uso por reserva (EMAILS_RESERVA_TOKEN_SECRET, ver
# supabase/functions/emails-reserva/tokens.ts). Las 3 rutas POST
# (/notificar, /recordatorios, /detectar-ausencias) se autentican con
# EMAILS_RESERVA_SHARED_SECRET (cabecera x-webhook-secret) y FALLAN CERRADO
# si esa env var falta — a diferencia de checkSharedSecret en reservas-web,
# que falla abierto (ver docs/REVISION-PUERTOS-N8N.md A-3).
[functions.emails-reserva]
verify_jwt = false

# La llama pg_cron (net.http_post, 03:30 UTC) sin usuario ni JWT: con
# verify_jwt = true la pasarela la cortaría con 401. La autenticación real es
# la cabecera x-webhook-secret == TRAFICO_WEB_CRON_SECRET (comparación en
# tiempo constante, FALLA CERRADO si la env var falta -> 500). El valor sale
# del secreto de Vault 'trafico_web_cron_secret'. Ver
# supabase/functions/sync-trafico-web/{index.ts,DEPLOY.md} y la migración
# 20260923200000_trafico_web.sql.
[functions.sync-trafico-web]
verify_jwt = false

# La llama pg_cron / el Cron del Dashboard una vez al día SIN usuario ni JWT
