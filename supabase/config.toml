verify_jwt = true

# Endpoint público del chatbot de casa-tomas-story. Sin JWT (igual que
# reservas-web): la web manda una publishable key `sb_publishable_…`, que no es
# un JWT, y con `true` la pasarela respondería 401 a todo. La protección real es
# el cupo `chat_web_reservar_cupo` + limitadores fail-closed (503 si fallan).
[functions.chat-web]
verify_jwt = false

# Huérfanas: cero llamadores en los cuatro repos. Se dejan a `true` para que no
