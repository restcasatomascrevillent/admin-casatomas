# - enviar-imagen-webhook: sin llamadores y sin variables de entorno.
# - notify-config-bot-change: relay sin autenticar a un webhook de n8n
#   hardcodeado en el código (index.ts:8).
[functions.enviar-imagen-webhook]
verify_jwt = true

[functions.notify-config-bot-change]
verify_jwt = true


# Login público: comprueba las credenciales en Auth, registra antes/después
