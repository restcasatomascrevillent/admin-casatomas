#   · x-webhook-secret == NEWSLETTER_SYNC_CRON_SECRET (tiempo constante, FALLA
#     CERRADO -> 500 si la env var falta), o
#   · JWT de usuario + can_read_section/can_write_section('marketing') (panel).
