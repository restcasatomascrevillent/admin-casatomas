<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#393F47" />
    <title>Sin conexión · Casa Tomás</title>
    <!-- Página de respaldo del service worker (public/sw.js). Estática, sin
         JavaScript ni datos de usuario; CSS en línea para no depender del build. -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #ffffff; color: #393f47;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55; -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
      h1 { margin: 0 0 10px; font-size: 1.5rem; line-height: 1.25; font-weight: 600; }
      p { margin: 0; font-size: 1rem; color: #475569; }
      .actions { margin-top: 24px; }
      a.button {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 24px; border-radius: 10px;
        background: #393f47; color: #ffffff; font-size: 1rem; font-weight: 600; text-decoration: none;
      }
      a.button:focus-visible { outline: 2px solid #b6852f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hemos podido cargar el panel. Comprueba la conexión a internet e inténtalo de nuevo.</p>
      <div class="actions"><a class="button" href="/">Reintentar</a></div>
    </main>
  </body>
</html>
